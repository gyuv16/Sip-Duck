[package]
name = "sip-duck"
version = "0.1.0"
description = "Ultra-lightweight anime desktop overlay companion (hydration + sedentary reminders)"
edition = "2021"
rust-version = "1.77"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` for the native tray; `macos-private-api` is required for truly transparent windows on macOS.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_SystemInformation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
debug = false
incremental = false

[profile.dev]
# Keep debug builds snappy while still optimising the heavy webview/tao deps.
incremental = true

[profile.dev.package."*"]
opt-level = 2
